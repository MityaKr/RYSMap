plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'RYS family'
        url = rootProject.file('../RYSCore/repo')
        content { includeGroup 'works.repka.ryscore' }
    }
}

// Автотест живёт только в запусках для разработки и в jar не попадает.
sourceSets {
    autotest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.autotest
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        // Сценарии в новом мире (-Pautotest): scan (замер сканера, регионы, повторный вход), ui (снимки рядом с макетами),
        // migrate (MapHello, папка на UUID мира, шаг map на копии карты FTB из fixtures). Куча задаётся явно (-Pheap, по умолчанию 3G).
        autotest {
            client()
            // -PrunDir=run-repys: копия клиента сборки (моды в <папка>/mods), для сценария server на настоящем сервере
            gameDirectory = project.file(project.findProperty('runDir') ?: 'run')
            jvmArgument "-Xmx${project.findProperty('heap') ?: '3G'}"
            systemProperty 'rysmap.autotest', project.findProperty('autotest') ?: 'scan'
            // сценарий server: JSON с адресом, ключом мира и точками (ServerAutoTest)
            systemProperty 'rysmap.autotest.plan', project.findProperty('plan') ?: ''
            // в копии сборки моды с GameTest для разработки (Binnie) падают без своих классов: GameTest выключены
            if (project.findProperty('runDir') != null) systemProperty 'neoforge.enableGameTest', 'false'
            // сценарий migrate берёт настоящую карту FTB из fixtures (в git её нет)
            systemProperty 'rysmap.ftbFixture', project.findProperty('ftbFixture') ?: project.file('../../_shared/_saved/fixtures/ftb-2026-11-18/client/ftbchunks').absolutePath
            programArguments.addAll '--width', '1280', '--height', '800'
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.autotest)

dependencies {
    implementation "works.repka.ryscore:ryscore-neoforge:${ryscore_version}"
    autotestImplementation "works.repka.ryscore:ryscore-neoforge:${ryscore_version}"
    jarJar("works.repka.ryscore:ryscore-neoforge:[${ryscore_version},2.0.0)") {
        version { prefer ryscore_version }
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    // модульные тесты идут без игры: библиотеки, которые чистый код берёт у Minecraft, подключаются явно, теми же версиями
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'it.unimi.dsi:fastutil:8.5.12'
    testImplementation 'org.jetbrains:annotations:24.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Модульные тесты без игры: формат регионов, палитра, кэш, читатель карты FTB.
// Настоящая папка карты FTB берётся из fixtures (в git её нет); тест пропускается, если папки нет.
test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    systemProperty 'rysmap.ftbFixture', project.findProperty('ftbFixture') ?: project.file('../../_shared/_saved/fixtures/ftb-2026-11-18/client/ftbchunks').absolutePath
    // данные FTB Essentials (места, дома, история) для шага places: копия с сервера 18.11
    systemProperty 'rysmap.ftbEssentials', project.findProperty('ftbEssentials') ?: project.file('../../_shared/_saved/fixtures/ftb-2026-11-18/world/ftbessentials').absolutePath
}

processResources {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        ryscore_version: ryscore_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
